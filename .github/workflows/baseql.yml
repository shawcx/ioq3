name: baseql
on: [push, pull_request]

jobs:
  game-modules:
    name: Game modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
    - uses: actions/checkout@v4
    - name: Compile
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BASEQL=ON -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF
        cmake --build build --config Release
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: baseql-${{ matrix.os }}
        path: build/Release/baseql
