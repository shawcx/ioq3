// baseql duel server settings. Run "exec duel.cfg", then start a map, for
// example "map aerowalk duel" or "startRandomMap".

set g_factory duel
set sv_mapPoolFile mappool_duel.txt

// a 10 second countdown once both players are in
set g_doWarmup 1
set g_warmup 10

// no bots, so don't load their navigation data
set bot_enable 0

// Quake Live runs the server at 40 frames a second; players should also set
// "snaps 40" to get a snapshot every frame
set sv_fps 40
